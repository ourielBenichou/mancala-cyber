<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Benichou's Mancala</title>
    <link rel="icon" href="data:," />
    <style>
        :root {
            --night: #12232e;
            --night-lit: #25495a;
            --walnut: #7a4a22;
            --walnut-dark: #3a210e;
            --brass: #f0c05a;
            --bone: #f3e8d2;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Trebuchet MS", "Segoe UI", Arial, sans-serif;
            color: var(--bone);
            text-align: center;
            background: radial-gradient(ellipse at 50% -10%, var(--night-lit) 0%, var(--night) 60%, #0a141b 100%) fixed;
        }
        h1 {
            margin: 0;
            font-family: Georgia, "Palatino Linotype", serif;
            font-size: clamp(22px, 4vw, 38px);
            letter-spacing: .5px;
        }

        /* ---- header: title + whose turn ---- */
        header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 10px 16px;
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px 14px 0;
        }
        .tor, .notTurn {
            border: none;
            border-radius: 14px;
            padding: 10px 18px;
            font: inherit;
            font-weight: 700;
            color: #fff;
        }
        .tor {
            background: linear-gradient(135deg, #8a58d4, #4f2fa3);
            box-shadow: 0 0 20px rgba(138, 88, 212, .75);
            animation: turnGlow 1.4s ease-in-out infinite alternate;
        }
        .notTurn { transition: opacity .3s; }
        .notTurn {
            background: rgba(255, 255, 255, .12);
            opacity: .45;
        }
        header h1 { order: 2; flex: 1 1 auto; }
        #100 { order: 1; }
        #101 { order: 3; }

        main {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: flex-start;
            gap: 12px;
            max-width: 1100px;
            margin: 0 auto;
            padding: 14px 12px 40px;
        }
        #aa { flex-basis: 100%; }

        /* ---- buttons ---- */
        .Start, .ghost {
            padding: 12px 26px;
            font: inherit;
            font-weight: 700;
            border: none;
            border-radius: 999px;
            cursor: pointer;
            color: var(--walnut-dark);
            background: linear-gradient(#ffd978, var(--brass));
            box-shadow: 0 4px 0 #b78a1f, 0 8px 16px rgba(0, 0, 0, .4);
        }
        .Start, .ghost { transition: transform .12s, filter .12s, box-shadow .12s, background .2s; }
        .Start:hover:not(:disabled) { transform: translateY(-2px); filter: brightness(1.07); }
        .ghost:hover:not(:disabled) { background: rgba(255, 255, 255, .18); }
        .Start:disabled, .ghost:disabled { opacity: .55; cursor: not-allowed; }
        .Start:active { transform: translateY(3px); box-shadow: 0 1px 0 #b78a1f, 0 4px 8px rgba(0, 0, 0, .4); }
        .ghost {
            color: var(--bone);
            background: rgba(255, 255, 255, .1);
            border: 1px solid rgba(255, 255, 255, .28);
            box-shadow: none;
        }
        .welcome { margin: 30px auto 22px; max-width: 460px; line-height: 1.5; font-size: 18px; }
        .account input {
            width: min(220px, 70vw);
            margin: 6px 4px;
            padding: 10px 14px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, .28);
            background: rgba(0, 0, 0, .25);
            color: var(--bone);
            font: inherit;
        }
        /* password box with the hold-to-show eye button inside it */
        .passwrap { position: relative; display: inline-block; }
        .passwrap input { padding-right: 44px; }
        /* hide the browser's own built-in eye (Edge) so only ours shows */
        .passwrap input::-ms-reveal,
        .passwrap input::-ms-clear { display: none; }
        .eye {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            width: 30px;
            height: 30px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            border-radius: 50%;
            background: transparent;
            color: var(--bone);
            opacity: .7;
            cursor: pointer;
            touch-action: none;             /* a long press on a phone must not scroll or select */
            user-select: none;
            -webkit-user-select: none;
        }
        .eye:hover, .eye.on { opacity: 1; color: var(--brass); }
        .eye svg { width: 20px; height: 20px; pointer-events: none; }
        .history {
            list-style: none;
            padding: 0;
            margin: 12px auto 0;
            text-align: left;
            font-size: 16px;
        }
        .history li { padding: 4px 0; border-bottom: 1px solid rgba(255, 255, 255, .12); }

        /* ---- evaluation bar ---- */
        .evl {
            display: flex;
            align-items: center;
            gap: 10px;
            width: min(100%, 520px);
            margin: 4px auto 0;
            font-weight: 700;
        }
        .evl span:first-child { color: #8fd3f4; }
        .evl span:last-child { color: #f3a08c; }
        .evlTrack {
            flex: 1;
            height: 14px;
            border-radius: 999px;
            overflow: hidden;
            background: #c0472f;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, .55);
        }
        .evlFill { height: 100%; background: #3aa6d6; transition: width .4s; }
        .evl em { font-style: normal; min-width: 48px; color: var(--brass); }

        /* ---- the board ---- */
        .board {
            display: grid;
            grid-template-columns: minmax(56px, 1fr) 6fr minmax(56px, 1fr);
            gap: 2.2%;
            width: min(100%, 1000px);
            margin: 14px auto 0;
            padding: 2.4%;
            border-radius: 28px;
            border: 3px solid var(--walnut-dark);
            background:
                repeating-linear-gradient(92deg, rgba(0, 0, 0, .06) 0 3px, rgba(255, 255, 255, .03) 3px 7px),
                linear-gradient(145deg, var(--walnut), var(--walnut-dark));
            box-shadow: 0 20px 44px rgba(0, 0, 0, .6), inset 0 2px 0 rgba(255, 255, 255, .2), inset 0 -8px 16px rgba(0, 0, 0, .4);
        }
        .pits { display: grid; grid-template-columns: repeat(6, 1fr); gap: clamp(6px, 1.6vw, 18px); }
        .pit, .store {
            position: relative;
            background: radial-gradient(circle at 50% 35%, #24130a 0%, #3a210f 62%, #54321a 100%);
            box-shadow: inset 0 9px 18px rgba(0, 0, 0, .75), inset 0 -2px 4px rgba(255, 255, 255, .14), 0 1px 0 rgba(255, 255, 255, .18);
        }
        .pit { aspect-ratio: 1; border-radius: 50%; transition: transform .12s, box-shadow .12s; }
        .store { border-radius: 999px; }
        .pit.playable { cursor: pointer; }
        .pit.playable:hover, .pit.playable:focus-visible {
            transform: scale(1.05);
            outline: none;
            box-shadow: inset 0 9px 18px rgba(0, 0, 0, .75), 0 0 0 3px var(--brass), 0 0 20px rgba(240, 192, 90, .65);
        }

        /* ---- glass stones ---- */
        .stone {
            position: absolute;
            width: 24%;
            aspect-ratio: 1;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            box-shadow: 0 3px 5px rgba(0, 0, 0, .6), inset 0 -3px 5px rgba(0, 0, 0, .3);
        }
        .store .stone { width: 26%; }
        .s0 { background: radial-gradient(circle at 35% 30%, #fff 0, #f58a92 22%, #d9444f 65%, #8e1f29 100%); }
        .s1 { background: radial-gradient(circle at 35% 30%, #fff 0, #8fbcf5 22%, #3f7fd8 65%, #1c3f86 100%); }
        .s2 { background: radial-gradient(circle at 35% 30%, #fff 0, #8fe3bf 22%, #35a878 65%, #17674a 100%); }
        .s3 { background: radial-gradient(circle at 35% 30%, #fff 0, #fad28a 22%, #f0a02f 65%, #a65f0c 100%); }
        .s4 { background: radial-gradient(circle at 35% 30%, #fff 0, #c8a8f3 22%, #8a58d4 65%, #4a2a8a 100%); }
        .s5 { background: radial-gradient(circle at 35% 30%, #fff 0, #8eeaea 22%, #3cc3c7 65%, #167a80 100%); }

        /* ---- stone counts (always shown) ---- */
        .count {
            position: absolute;
            left: 50%;
            bottom: -5%;
            transform: translateX(-50%);
            min-width: 28px;
            padding: 1px 9px;
            border-radius: 999px;
            font-family: Georgia, serif;
            font-size: clamp(12px, 1.8vw, 17px);
            color: var(--brass);
            background: rgba(10, 10, 10, .72);
            border: 1px solid rgba(255, 255, 255, .22);
            pointer-events: none;
        }
        .store .count { bottom: auto; top: 3%; font-size: clamp(15px, 2.6vw, 24px); }

        /* ---- win / draw message ---- */
        .Win { display: none; }
        .Win-H {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            position: fixed;
            top: 20vh;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            width: min(90vw, 460px);
            padding: 34px 20px;
            border: 3px solid var(--brass);
            border-radius: 24px;
            cursor: pointer;
            color: var(--bone);
            font: inherit;
            background: linear-gradient(160deg, #5a3317, #2b170a);
            box-shadow: 0 0 0 100vmax rgba(0, 0, 0, .6), 0 20px 50px rgba(0, 0, 0, .7);
            animation: winPop .5s cubic-bezier(.2, 1.4, .4, 1);
        }
        .Win-H strong { font-family: Georgia, serif; font-size: clamp(30px, 7vw, 52px); color: var(--brass); }
        .Win-H span { font-size: 18px; }

        /* ---- dialog (rules, online lobby, messages) ---- */
        .modalBack {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(4, 10, 14, .72);
            animation: modalFade .15s ease-out;
        }
        .modalBack[hidden] { display: none; }
        .modalCard {
            position: relative;
            width: min(100%, 540px);
            max-height: 88vh;
            overflow-y: auto;
            padding: 26px 24px 22px;
            text-align: left;
            border: 3px solid var(--brass);
            border-radius: 24px;
            color: var(--bone);
            background: linear-gradient(160deg, #5a3317, #2b170a);
            box-shadow: 0 20px 50px rgba(0, 0, 0, .7);
            animation: modalRise .2s ease-out;
        }
        .modalCard h2 {
            margin: 0 34px 14px 0;
            font-family: Georgia, "Palatino Linotype", serif;
            font-size: clamp(22px, 5vw, 30px);
            color: var(--brass);
        }
        .modalX {
            position: absolute;
            top: 12px;
            right: 14px;
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 50%;
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            color: var(--bone);
            background: rgba(255, 255, 255, .12);
        }
        .modalX:hover, .modalX:focus-visible { background: rgba(255, 255, 255, .24); outline: none; }
        .modalBody { font-size: 16px; line-height: 1.55; }
        .modalBody p { margin: 0 0 10px; }
        .modalBody h3 {
            margin: 16px 0 6px;
            font-size: 17px;
            color: var(--brass);
        }
        .modalBody ul, .modalBody ol { margin: 0 0 8px; padding-left: 22px; }
        .modalBody li { margin-bottom: 6px; }
        .modalBody .tip {
            margin-top: 14px;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 15px;
            background: rgba(0, 0, 0, .28);
            border: 1px solid rgba(255, 255, 255, .16);
        }
        .modalActions {
            display: flex;
            flex-wrap: wrap;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 18px;
        }
        .modalActions .Start, .modalActions .ghost { padding: 10px 22px; }
        .modalBody input {
            width: 100%;
            margin: 4px 0 2px;
            padding: 12px 16px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, .28);
            background: rgba(0, 0, 0, .3);
            color: var(--bone);
            font: inherit;
        }
        .modalBody input.code {
            text-align: center;
            font-family: Georgia, serif;
            font-size: 26px;
            letter-spacing: 8px;
            text-transform: uppercase;
        }
        .modalBody .or {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 14px 0;
            color: rgba(243, 232, 210, .6);
            font-size: 14px;
        }
        .modalBody .or::before, .modalBody .or::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, .2);
        }
        .modalBody .sub { margin: 0 0 6px; font-size: 14px; color: rgba(243, 232, 210, .75); }

        .belowBoard { margin-top: 12px; }

        /* ---- move animation: follow the stones ---- */
        .board { position: relative; }
        .flyStone {
            position: absolute;
            left: 0;
            top: 0;
            z-index: 5;
            border-radius: 50%;
            pointer-events: none;
            will-change: transform;
            box-shadow: 0 8px 14px rgba(0, 0, 0, .55), 0 0 16px rgba(255, 255, 255, .6);
        }
        .flyStone b {
            position: absolute;
            left: 50%;
            top: -1.7em;
            transform: translateX(-50%);
            padding: 0 7px;
            border-radius: 999px;
            font: 700 13px Georgia, serif;
            color: #fff;
            background: rgba(0, 0, 0, .78);
            border: 1px solid rgba(255, 255, 255, .35);
        }
        .pit.src, .store.src {
            box-shadow: inset 0 9px 18px rgba(0, 0, 0, .75), 0 0 0 3px rgba(240, 192, 90, .95), 0 0 22px rgba(240, 192, 90, .8);
        }
        .pit.drop, .store.drop { animation: dropPulse .35s ease-out; }
        .pit.cap { animation: capFlash .5s ease-in-out 1; }
        .pit.lastFrom, .store.lastFrom { outline: 2px dashed rgba(240, 192, 90, .75); outline-offset: 3px; }
        .pit.lastTo, .store.lastTo { outline: 3px solid rgba(240, 192, 90, .95); outline-offset: 3px; }
        .moveNote {
            min-height: 1.5em;
            margin-top: 12px;
            font-size: 16px;
            color: var(--bone);
            animation: noteIn .35s ease-out;
        }
        .callout {
            position: absolute;
            left: 50%;
            top: 50%;
            z-index: 6;
            padding: 10px 26px;
            border-radius: 999px;
            font: 700 clamp(18px, 3.4vw, 30px) Georgia, serif;
            white-space: nowrap;
            pointer-events: none;
            color: var(--walnut-dark);
            background: linear-gradient(#ffd978, var(--brass));
            box-shadow: 0 8px 22px rgba(0, 0, 0, .55), 0 0 26px rgba(240, 192, 90, .8);
            animation: calloutPop 1.4s ease-out forwards;
        }
        @keyframes dropPulse {
            0% { transform: scale(1.14); box-shadow: inset 0 9px 18px rgba(0, 0, 0, .75), 0 0 0 4px rgba(255, 255, 255, .9), 0 0 24px rgba(255, 255, 255, .8); }
            100% { transform: scale(1); }
        }
        @keyframes capFlash {
            0%, 100% { box-shadow: inset 0 9px 18px rgba(0, 0, 0, .75); }
            50% { transform: scale(1.1); box-shadow: inset 0 9px 18px rgba(0, 0, 0, .55), 0 0 0 4px #ff7a5c, 0 0 28px #ff7a5c; }
        }
        @keyframes calloutPop {
            0% { opacity: 0; transform: translate(-50%, -20%) scale(.6); }
            14% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            24% { transform: translate(-50%, -50%) scale(1); }
            78% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0; transform: translate(-50%, -90%) scale(1); }
        }
        @keyframes noteIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        @keyframes turnGlow {
            from { box-shadow: 0 0 12px rgba(138, 88, 212, .55); }
            to { box-shadow: 0 0 26px rgba(176, 130, 255, .95); }
        }
        @keyframes winPop {
            from { opacity: 0; transform: translateX(-50%) translateY(24px) scale(.82); }
            to { opacity: 1; transform: translateX(-50%); }
        }

        /* ---- owner panel ---- */
        .modalCard.wide { width: min(100%, 780px); }
        .tableWrap { overflow-x: auto; margin: 0 -4px; padding: 0 4px; }
        .adminTable { width: 100%; border-collapse: collapse; font-size: 14px; }
        .adminTable th {
            text-align: left;
            padding: 6px 8px;
            color: var(--brass);
            font-weight: 700;
            border-bottom: 1px solid rgba(255, 255, 255, .28);
            white-space: nowrap;
        }
        .adminTable td {
            padding: 8px;
            vertical-align: middle;
            border-bottom: 1px solid rgba(255, 255, 255, .12);
        }
        .adminTable tr.isBlocked td.name { text-decoration: line-through; opacity: .7; }
        .adminTable .acts { text-align: right; }
        .adminTable .joined { white-space: nowrap; }
        @media (max-width: 600px) {
            .adminTable .joined { display: none; }          /* make room for the buttons on a phone */
            .adminTable td, .adminTable th { padding: 6px 4px; }
        }
        .mini { padding: 5px 12px; font-size: 13px; margin: 2px 0 2px 4px; }
        .danger { color: #ffb4a4; border-color: rgba(255, 140, 120, .6); }
        .badge {
            display: inline-block;
            padding: 1px 8px;
            border-radius: 999px;
            font-size: 12px;
            background: rgba(255, 255, 255, .14);
        }
        .badge.owner { background: var(--brass); color: var(--walnut-dark); font-weight: 700; }
        .badge.blocked { background: #c0472f; color: #fff; }
        .badge.pending { background: #e8c25a; color: var(--walnut-dark); font-weight: 700; }
        .modalBody .muted { color: rgba(243, 232, 210, .7); font-size: 14px; }

        /* ---- owner panel: a player's game history ---- */
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(78px, 1fr)); gap: 8px; margin: 10px 0; }
        .stat {
            padding: 8px 6px;
            text-align: center;
            border-radius: 12px;
            background: rgba(0, 0, 0, .28);
            border: 1px solid rgba(255, 255, 255, .14);
        }
        .stat b { display: block; font: 700 22px Georgia, serif; color: var(--brass); }
        .stat.win b { color: #6fdca8; }
        .stat.loss b { color: #ff9a82; }
        .stat span { font-size: 12px; color: rgba(243, 232, 210, .75); }
        .split { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 0 0 8px; font-size: 14px; color: rgba(243, 232, 210, .85); }
        .split strong { color: var(--brass); }
        .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 6px 0; }
        .chips .label { font-size: 13px; color: rgba(243, 232, 210, .7); margin-right: 2px; }
        .chip {
            padding: 4px 12px;
            border-radius: 999px;
            font: inherit;
            font-size: 13px;
            cursor: pointer;
            color: var(--bone);
            background: rgba(255, 255, 255, .1);
            border: 1px solid rgba(255, 255, 255, .28);
            transition: background .15s;
        }
        .chip:hover { background: rgba(255, 255, 255, .2); }
        .chip.on { background: var(--brass); color: var(--walnut-dark); border-color: var(--brass); font-weight: 700; }
        .tableWrap.tall { max-height: 44vh; overflow-y: auto; margin-top: 6px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, .12); }
        .tableWrap.tall th { position: sticky; top: 0; z-index: 1; background: #3b2210; }
        .adminTable tr.dayRow td {
            padding: 5px 8px;
            font-size: 13px;
            font-weight: 700;
            color: var(--brass);
            background: rgba(0, 0, 0, .3);
        }
        .adminTable td.time { white-space: nowrap; color: rgba(243, 232, 210, .7); font-size: 13px; }
        .adminTable td.score { white-space: nowrap; font-family: Georgia, serif; font-size: 15px; }
        .adminTable td.winner { font-weight: 700; }
        .res { display: inline-block; min-width: 46px; padding: 1px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; color: #fff; text-align: center; }
        .res.win { background: #2f9e6a; }
        .res.loss { background: #c0472f; }
        .res.draw { background: #6d7b86; }
        .tag { margin-left: 6px; padding: 0 7px; border-radius: 999px; font-size: 11px; color: rgba(243, 232, 210, .85); border: 1px solid rgba(255, 255, 255, .3); }
        .modalBody input.search { margin: 6px 0; padding: 8px 14px; font-size: 14px; }

        /* ---- waiting for the other player ---- */
        .waitCard {
            width: min(100%, 420px);
            margin: 24px auto;
            padding: 24px 20px;
            border: 3px solid var(--brass);
            border-radius: 24px;
            background: linear-gradient(160deg, #5a3317, #2b170a);
            box-shadow: 0 12px 30px rgba(0, 0, 0, .5);
        }
        .waitCard h2 { margin: 0 0 8px; font-family: Georgia, serif; color: var(--brass); }
        .waitCard p { margin: 6px 0; }
        .waitCard .ghost { display: block; margin: 12px auto 0; padding: 8px 22px; }
        .waitCode {
            display: inline-block;
            margin: 10px 0;
            padding: 8px 22px;
            border-radius: 16px;
            font-family: Georgia, serif;
            font-size: clamp(34px, 9vw, 52px);
            letter-spacing: 10px;
            text-indent: 10px;
            color: var(--brass);
            background: rgba(0, 0, 0, .35);
            border: 1px dashed rgba(240, 192, 90, .6);
        }

        @keyframes modalFade { from { opacity: 0; } to { opacity: 1; } }
        @keyframes modalRise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

        @media (prefers-reduced-motion: reduce) {
            * { transition: none !important; animation: none !important; }
        }
    </style>
</head>
<body>
    <header>
        <button id="100" class="tor" style="display:none;">Player A's turn</button>
        <h1>Benichou's Mancala</h1>
        <button id="101" class="notTurn" style="display:none;">Player B's turn</button>
    </header>

    <button id="ad" class="Win" onclick="showBoard()"><strong>Draw</strong><span>Click to play again</span></button>
    <button id="ab" class="Win" onclick="showBoard()"><strong>Player A wins!</strong><span>Click to play again</span></button>
    <button id="ac" class="Win" onclick="showBoard()"><strong>Player B wins!</strong><span>Click to play again</span></button>

    <main>
        <div id="aa">
            <p class="welcome">Sow the stones from one of your pits around the board and fill your store.</p>
            <button class="Start" onclick="showBoard()">Start game</button>
            <button class="ghost" onclick="ShowRules()">Rules</button>
        </div>
    </main>

    <div id="modal" class="modalBack" hidden>
        <div class="modalCard" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
            <button type="button" class="modalX" id="modalX" aria-label="Close">&times;</button>
            <h2 id="modalTitle"></h2>
            <div id="modalBody" class="modalBody"></div>
            <div id="modalActions" class="modalActions"></div>
        </div>
    </div>

    <script src="online.js"></script>
</body>
